---
layout: default
---

{% assign gallery = site.data.gallery %}

{% if gallery and gallery.total_locations > 0 %}
<section class="gallery-earth" aria-labelledby="gallery-map-title" data-gallery-earth>
  <div class="gallery-map-stage">
    <div id="gallery-map" class="gallery-map-canvas" data-gallery-map data-mapbox-token="{{ site.mapbox.public_token | escape }}" data-mapbox-style="{{ site.mapbox.style | escape }}" data-mapbox-dark-style="{{ site.mapbox.dark_style | default: 'mapbox://styles/mapbox/dark-v11' | escape }}" aria-label="照片地图"></div>
    <p class="gallery-map-status" data-gallery-map-status role="status">正在加载地图…</p>
  </div>

  <h1 id="gallery-map-title" class="screen-reader-text">照片地图</h1>
  <a class="gallery-earth-back" href="{{ '/category/gallery/' | relative_url }}" aria-label="返回图库">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>
  </a>
  <div class="gallery-earth-actions">
    <button type="button" class="gallery-earth-theme" data-gallery-map-theme aria-label="切换深色地图" aria-pressed="false">
      <svg class="gallery-earth-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.1A8.6 8.6 0 0 1 10.9 3.5a8.6 8.6 0 1 0 9.6 9.6Z"/></svg>
      <svg class="gallery-earth-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" class="gallery-earth-overview" data-gallery-map-overview>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
      <span>地球视图</span>
    </button>
  </div>

  <aside class="gallery-map-detail" aria-label="地图选中地点" hidden>
    <div class="gallery-earth-detail-bar">
      <button type="button" class="gallery-map-detail-toggle" data-gallery-map-toggle aria-expanded="true" aria-controls="gallery-map-detail-content">
        <span data-gallery-map-toggle-label>地图选中地点</span>
        <span class="gallery-map-chevron" aria-hidden="true">⌄</span>
      </button>
      <button class="gallery-earth-close" type="button" data-gallery-map-close aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="gallery-map-detail-content" class="gallery-map-detail-content" data-gallery-map-detail aria-live="polite"></div>
  </aside>

  <script id="gallery-map-data" type="application/json">{{ gallery.entries | jsonify }}</script>
</section>
{% else %}
  <article class="page type-page hentry archive-empty">
    <div class="entry-content">
      <a href="{{ '/category/gallery/' | relative_url }}">返回图库</a>
      <p class="category-empty">这里还没有可展示的地图照片。</p>
    </div>
  </article>
{% endif %}
