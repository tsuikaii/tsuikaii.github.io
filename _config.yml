title: tsuikaii
author: tsuikaii
email: hello@tsuikaii.dev
description: "记录阅读、技术与日常生活的极简博客。"
sidebar_note: "一个安静写字的地方。"
location: "Shanghai"
logo: "/assets/images/logo-mark.png"
baseurl: ""
url: "https://tsuikaii.com"
lang: zh-CN
# Public service URL only; the API key is stored in Cloudflare Worker Secrets.
translation_endpoint: "https://tsuikaii-translations.zhe-cf.workers.dev"
exclude:
  - node_modules
  - worker
  - tests
  - scripts
  - docs
  - package.json
  - package-lock.json
  - README.md
timezone: Asia/Shanghai
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
paginate: 10
paginate_path: "/page/:num/"
header_pages:
  - about.md
permalink: /:categories/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
